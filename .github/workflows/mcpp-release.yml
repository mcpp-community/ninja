# Builds ninja 1.12.1 with the correction of ninja-build/ninja#2662
# (ninja-build/ninja#2840, first commit) as the four assets xlings-res/ninja
# publishes: a file `ninja` (`ninja.exe`) at the root of each archive.
name: mcpp-release
on:
  push:
    branches: ['mcpp/**']
    tags: ['*-mcpp.*']
  workflow_dispatch:
env:
  VERSION: 1.12.1-mcpp.1
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: linux-x86_64,   os: ubuntu-22.04,     archive: tar }
          - { id: linux-aarch64,  os: ubuntu-24.04-arm, archive: tar }
          - { id: macosx-arm64,   os: macos-15,         archive: tar }
          - { id: windows-x86_64, os: windows-2022,     archive: zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # glibc, linked statically, as the published 1.12.1 asset is.
      - name: Build (linux x86_64, static glibc)
        if: matrix.id == 'linux-x86_64'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXE_LINKER_FLAGS=-static
          cmake --build build -j4
          (cd build && ./ninja_test)
          strip build/ninja
      # musl, linked statically, as the published 1.12.1 asset is.
      - name: Build (linux aarch64, static musl)
        if: matrix.id == 'linux-aarch64'
        run: |
          docker run --rm -v "$PWD:/src" -w /src alpine:3.20 sh -ec '
            apk add --no-cache g++ cmake make samurai linux-headers >/dev/null
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXE_LINKER_FLAGS=-static
            cmake --build build -j4
            (cd build && ./ninja_test)
            strip build/ninja'
          sudo chown -R "$(id -u)" build
      # Both architectures in one file, as the published 1.12.1 asset is.
      - name: Build (macOS, universal)
        if: matrix.id == 'macosx-arm64'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
                '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15
          cmake --build build -j4
          (cd build && ./ninja_test)
          strip build/ninja
      - name: Build (windows, MSVC, static runtime)
        if: matrix.id == 'windows-x86_64'
        shell: bash
        run: |
          cmake -S . -B build -A x64
          cmake --build build --config Release -j4
          (cd build/Release && ./ninja_test.exe)
          cp build/Release/ninja.exe build/ninja.exe
      - name: Version
        shell: bash
        run: |
          got=$(build/ninja --version)
          [ "$got" = "$VERSION" ] || { echo "ninja --version says $got, expected $VERSION"; exit 1; }
      - name: Archive
        shell: bash
        run: |
          mkdir out
          name=ninja-$VERSION-${{ matrix.id }}
          if [ "${{ matrix.archive }}" = zip ]; then
            (cd build && 7z a -tzip "../out/$name.zip" ninja.exe >/dev/null)
            f=$name.zip
          else
            tar -C build -czf "out/$name.tar.gz" ninja
            f=$name.tar.gz
          fi
          cd out
          if command -v sha256sum >/dev/null; then sha256sum "$f" > "$f.sha256"; else shasum -a 256 "$f" > "$f.sha256"; fi
          cat "$f.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}
          path: out/*
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* -R "$GITHUB_REPOSITORY" --prerelease \
            --title "ninja $GITHUB_REF_NAME" \
            --notes "ninja 1.12.1 with the correction of ninja-build/ninja#2662 (ninja-build/ninja#2840, first commit). Built for mcpp; not an upstream release."
